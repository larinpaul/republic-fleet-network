server:
  port: 8081

spring:
  application:
    name: hull-fabrication-service

  # --- PostgreSQL Connection (The Durasteel Vault) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/republic_fleet
    username: jedi_master
    password: ${DB_PASSWORD:force_is_strong}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Kafka Configuration (The HoloNet Uplink) ---
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# --- Custom Republic Config ---
republic:
  shipyard:
    name: "Coruscant Primary Forge"
    max-concurrent-builds: 50
    